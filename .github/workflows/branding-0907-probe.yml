name: Branding 0907 TDD Probe

on:
  push:
    branches:
      - brand/branding-kit-0907-integration

permissions:
  contents: read

concurrency:
  group: branding-0907-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targeted:
    name: Branding identity contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node 24.20.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.20.0
      - name: Run Branding Kit 0907 contracts
        run: node --test tests/architecture/branding-kit-0907.test.mjs tests/architecture/seo-contract.test.mjs
