name: Branding 0907 Canonical Formatter Probe

on:
  push:
    branches:
      - brand/branding-kit-0907-integration

permissions:
  contents: read

jobs:
  format:
    name: Capture canonical Branding 0907 formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout verified content candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 2ca22a5b98f16d07f3a3674ef7d0f97c3fd8dacd
          persist-credentials: false
      - name: Set up Node 24.20.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.20.0
      - name: Activate project package manager
        run: |
          corepack enable
          pnpm --version
      - name: Install locked formatter without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Apply canonical Prettier output
        run: |
          pnpm exec prettier --write \
            docs/superpowers/plans/2026-09-07-branding-kit-0907-marketing-integration.md \
            docs/superpowers/specs/2026-09-07-branding-kit-0907-marketing-integration-design.md \
            src/components/sections/AboutBlueSkyz.astro \
            src/components/sections/BrandStory.astro \
            src/pages/about.astro \
            tests/architecture/brand-assets.test.mjs \
            tests/architecture/branding-kit-0907.test.mjs \
            tests/architecture/trust-surfaces.test.mjs
      - name: Verify canonical formatting
        run: pnpm exec prettier --check "**/*.{astro,ts,tsx,js,mjs,json,md,css,yaml,yml}"
      - name: Upload canonical files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: branding-0907-canonical-format
          path: |
            docs/superpowers/plans/2026-09-07-branding-kit-0907-marketing-integration.md
            docs/superpowers/specs/2026-09-07-branding-kit-0907-marketing-integration-design.md
            src/components/sections/AboutBlueSkyz.astro
            src/components/sections/BrandStory.astro
            src/pages/about.astro
            tests/architecture/brand-assets.test.mjs
            tests/architecture/branding-kit-0907.test.mjs
            tests/architecture/trust-surfaces.test.mjs
          if-no-files-found: error
          retention-days: 1
