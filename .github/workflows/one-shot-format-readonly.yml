name: One-shot format readback

on:
  push:
    branches:
      - audit/canonical-domain-architecture-convergence-20260909
    paths:
      - .github/workflows/one-shot-format-readonly.yml

permissions:
  contents: read

jobs:
  format-readback:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node 24.20.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.20.0
          check-latest: false
      - name: Activate pinned pnpm
        run: |
          corepack enable
          pnpm --version
      - name: Install formatter graph without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Format exact files and print canonical contents
        shell: bash
        run: |
          set -euo pipefail
          files=(
            AGENTS.md
            architecture/sgps-model.json
            docs/superpowers/plans/2026-09-03-remaining-convergence.md
            scripts/generate-architecture-views.mjs
            tests/architecture/sgps-architecture-model.test.mjs
          )
          pnpm exec prettier --write "${files[@]}"
          for f in "${files[@]}"; do
            echo "FORMAT_FILE_BEGIN:$f"
            base64 -w0 "$f"
            echo
            echo "FORMAT_FILE_END:$f"
          done
