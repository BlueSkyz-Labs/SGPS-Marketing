name: One-shot architecture test format diff

on:
  push:
    branches:
      - audit/canonical-domain-architecture-convergence-20260909
    paths:
      - .github/workflows/one-shot-architecture-test-format-readback.yml

permissions:
  contents: read

jobs:
  format-readback:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node 24.20.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.20.0
          check-latest: false
      - name: Activate pinned pnpm
        run: |
          corepack enable
          pnpm --version
      - name: Install formatter graph without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Print canonical formatting diff
        shell: bash
        run: |
          set -euo pipefail
          file="tests/architecture/sgps-architecture-model.test.mjs"
          pnpm exec prettier --write "$file"
          git diff -- "$file"
