name: One-shot lockfile refresh

on:
  push:
    branches:
      - audit/canonical-domain-architecture-convergence-20260909

permissions:
  contents: write

jobs:
  refresh:
    if: github.ref == 'refs/heads/audit/canonical-domain-architecture-convergence-20260909'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: audit/canonical-domain-architecture-convergence-20260909
          persist-credentials: true
      - name: Set up Node 24.20.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.20.0
      - name: Activate pinned pnpm
        run: |
          corepack enable
          test "$(pnpm --version)" = "11.25.0"
      - name: Regenerate lockfile without lifecycle scripts
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Verify patched dependency graph
        run: |
          pnpm audit --audit-level=moderate
          grep -q '^  sharp: 0.35.4$' pnpm-lock.yaml
          ! grep -A8 '^  miniflare@' pnpm-lock.yaml | grep -q 'sharp: 0.35.2'
      - name: Commit lockfile and remove one-shot workflow
        run: |
          git config user.name "sgps-lockfile-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pnpm-lock.yaml pnpm-workspace.yaml
          git rm .github/workflows/lockfile-refresh.yml
          git diff --cached --check
          git commit -m "security: refresh lockfile for patched sharp"
          git push origin HEAD:audit/canonical-domain-architecture-convergence-20260909
