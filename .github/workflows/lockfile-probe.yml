name: Lockfile Finalizer

on:
  push:
    branches:
      - audit/pin-wrangler-deploy-2026-09-07

permissions:
  contents: write

jobs:
  finalize-lockfile:
    name: Finalize locked Wrangler graph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate with branch-scoped writeback
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Set up Node 24.20.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.20.0
      - name: Activate integrity-pinned package manager
        run: |
          corepack enable
          pnpm --version
      - name: Resolve lockfile without lifecycle execution
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Apply deterministic deployment hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          deploy_path = Path("scripts/deploy-workers.mjs")
          deploy = deploy_path.read_text()
          old = 'run("npx", ["wrangler", "deploy"]);'
          new = 'run("pnpm", ["wrangler", "deploy"]);'
          if old not in deploy:
              raise SystemExit("expected bare npx Wrangler invocation not found")
          deploy_path.write_text(deploy.replace(old, new, 1))

          test_path = Path("tests/architecture/deploy-toolchain.test.mjs")
          test_path.write_text('''import assert from "node:assert/strict";\nimport { readFileSync } from "node:fs";\nimport test from "node:test";\n\nconst pkg = JSON.parse(readFileSync("package.json", "utf8"));\nconst lockfile = readFileSync("pnpm-lock.yaml", "utf8");\nconst deployScript = readFileSync("scripts/deploy-workers.mjs", "utf8");\n\ntest("Workers deployment uses a project-local locked Wrangler", () => {\n  assert.equal(pkg.devDependencies?.wrangler, "4.127.1");\n  assert.match(\n    lockfile,\n    /wrangler:\\n\\s+specifier: 4\\.127\\.1\\n\\s+version: 4\\.127\\.1/,\n  );\n  assert.match(deployScript, /run\\("pnpm", \\["wrangler", "deploy"\\]\\)/);\n  assert.doesNotMatch(deployScript, /run\\("npx"|wrangler@latest|pnpm.*dlx/);\n});\n''')

          Path(".github/workflows/lockfile-probe.yml").unlink()
          PY
      - name: Verify targeted contract and patch hygiene
        run: |
          node --test tests/architecture/deploy-toolchain.test.mjs
          git diff --check
      - name: Commit deterministic generated graph
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml scripts/deploy-workers.mjs tests/architecture/deploy-toolchain.test.mjs
          git add -u .github/workflows/lockfile-probe.yml
          git diff --cached --check
          git commit -m "security: pin Wrangler deployment toolchain"
          git push origin HEAD:audit/pin-wrangler-deploy-2026-09-07
