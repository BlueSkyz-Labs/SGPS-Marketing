name: One-shot convergence formatter

on:
  push:
    branches:
      - audit/canonical-domain-architecture-convergence-20260909

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Node 24.20.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.20.0

      - name: Activate pinned pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install formatting toolchain without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Format exact convergence files
        run: >-
          pnpm exec prettier --write
          AGENTS.md
          architecture/sgps-model.json
          docs/superpowers/plans/2026-09-03-remaining-convergence.md
          scripts/generate-architecture-views.mjs
          tests/architecture/sgps-architecture-model.test.mjs

      - name: Verify formatting and architecture
        run: |
          pnpm format:check
          pnpm test:architecture

      - name: Commit formatted files and self-remove
        run: |
          rm .github/workflows/format-fix.yml
          git config user.name "BlueSkyz-Labs automation"
          git config user.email "35994305+blackangelz@users.noreply.github.com"
          git add AGENTS.md architecture/sgps-model.json docs/superpowers/plans/2026-09-03-remaining-convergence.md scripts/generate-architecture-views.mjs tests/architecture/sgps-architecture-model.test.mjs .github/workflows/format-fix.yml
          git diff --cached --check
          git commit -m "style: format convergence artifacts"
          git push origin HEAD:${{ github.ref_name }}
