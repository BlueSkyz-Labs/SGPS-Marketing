name: Source Assurance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: source-assurance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node 24.20.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
      - name: Activate project package manager
        run: |
          corepack enable
          pnpm --version
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Dependency vulnerability audit
        run: pnpm audit --audit-level=moderate
      - name: Architecture contracts
        run: pnpm test:architecture
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Formatting
        run: pnpm format:check
      - name: Static build
        run: pnpm build
      - name: Client JavaScript budget
        run: pnpm check:client-budget
      - name: Static links
        run: pnpm check:static-links
      - name: Publishability compiler
        run: pnpm check:publishability
      - name: Integrity regression firewall
        run: pnpm check:integrity-firewall
      - name: Git evidence provenance
        run: pnpm verify:git-evidence
      - name: Promotion assurance state
        run: pnpm check:promotion-state
      - name: Deployment evidence ledger
        run: pnpm check:deployment-evidence

  browser-assurance:
    name: Browser Assurance
    needs: quality-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node 24.20.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
      - name: Activate project package manager
        run: |
          corepack enable
          pnpm --version
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Build browser test artifact
        run: pnpm build
      - name: Install Playwright runtimes
        timeout-minutes: 10
        run: |
          set -e
          installed=0
          for attempt in 1 2 3; do
            if pnpm exec playwright install --with-deps chromium firefox webkit; then
              installed=1
              break
            fi
            echo "Attempt $attempt failed; waiting 20s before retry..."
            sleep 20
          done
          if [ "$installed" != "1" ]; then
            echo "Playwright runtime installation failed after 3 attempts" >&2
            exit 1
          fi
          node -e "const {chromium,firefox,webkit}=require('@playwright/test');
            Promise.all([chromium.launch(),firefox.launch(),webkit.launch()])
              .then((browsers)=>Promise.all(browsers.map((b)=>b.close())))
              .then(()=>console.log('All three browser runtimes launched successfully'))
              .catch((error)=>{console.error(error);process.exit(1);});"

      - name: Playwright and axe assurance
        run: pnpm test:e2e
      - name: Lighthouse CI
        run: pnpm lighthouse
