name: Source Assurance

on:
  pull_request:
    # `closed` is what makes the post-merge landing guard actually run:
    # on opened/synchronize there is no merge commit yet (merge_commit_sha
    # is null), so without this event type the guard would never execute.
    # `labeled`/`unlabeled` rerun the merge policy when the Owner approves.
    types: [opened, synchronize, reopened, labeled, unlabeled, closed]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-assurance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node 24.20.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
      - name: Merge policy (protected paths need the owner-approved label)
        # Auto-merge lands a PR once required checks pass, so this required job
        # also holds governance, supply-chain, deployment and gate roots until
        # the Owner labels the PR. The policy file is read from the BASE commit
        # so a pull request cannot relax the rule for itself.
        if: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          policy="${RUNNER_TEMP}/check-merge-policy.mjs"
          if git cat-file -e "${BASE_SHA}:scripts/check-merge-policy.mjs" 2>/dev/null; then
            git show "${BASE_SHA}:scripts/check-merge-policy.mjs" > "${policy}"
          else
            # Bootstrap only: the pull request that introduces the policy.
            cp scripts/check-merge-policy.mjs "${policy}"
          fi
          node "${policy}" --base "${BASE_SHA}" --head "${HEAD_SHA}"
      - name: Activate project package manager
        run: |
          corepack enable
          pnpm --version
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Dependency vulnerability audit
        run: pnpm audit --audit-level=moderate
      - name: Architecture contracts
        run: pnpm test:architecture
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Formatting
        run: pnpm format:check
      - name: Static build
        run: pnpm build
      - name: Client JavaScript budget
        run: pnpm check:client-budget
      - name: Static links
        run: pnpm check:static-links
      - name: Publishability compiler
        run: pnpm check:publishability
      - name: Integrity regression firewall
        run: pnpm check:integrity-firewall
      - name: Git evidence provenance
        run: pnpm verify:git-evidence
      - name: Promotion assurance state
        run: pnpm check:promotion-state
      - name: Historical deployment evidence baseline (not current-head proof)
        run: pnpm check:deployment-evidence
      - name: Product provenance
        run: pnpm check:product-provenance
      - name: Post-merge landing verification (fail-closed)
        # Runs only once a pull request actually merged: on open PRs
        # merge_commit_sha is null, so this step must not pretend to pass.
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.merged == true }}
        run: |
          # Deterministic, no-network guard: verifies that the cited merge
          # commit reaches origin/main (checkout uses fetch-depth: 0).
          if [ -n "${POST_MERGE_MERGE_COMMIT:-}" ]; then
            node scripts/verify-post-merge-landing.mjs \
              --merge-commit "${POST_MERGE_MERGE_COMMIT:-}" \
              --ref origin/main || exit 1
          else
            echo "FAIL: post-merge landing verification requires github.event.pull_request.merge_commit_sha; missing evidence cannot be treated as SKIPPED/PASS." >&2
            exit 1
          fi
        env:
          POST_MERGE_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          POST_MERGE_MERGE_COMMIT: ${{ github.event.pull_request.merge_commit_sha || '' }}

  # Browser Assurance is sharded so the wall-clock cost is the slowest engine,
  # not the sum of all four. Coverage is unchanged: the shard list below must
  # equal E2E_PROJECTS in scripts/run-e2e.mjs
  # (tests/architecture/browser-assurance-matrix.test.mjs enforces it).
  browser-shards:
    name: Browser shard (${{ matrix.project }})
    needs: quality-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
          - project: mobile-chromium
            browser: chromium
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node 24.20.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
      - name: Activate project package manager
        run: |
          corepack enable
          pnpm --version
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Build browser test artifact
        run: pnpm build
      - name: Verify digest-pinned Playwright runtime
        env:
          SHARD_BROWSER: ${{ matrix.browser }}
        run: |
          set -euo pipefail
          if env | grep -Eq '^PLAYWRIGHT_(DOWNLOAD_HOST|CHROMIUM_DOWNLOAD_HOST|FIREFOX_DOWNLOAD_HOST|WEBKIT_DOWNLOAD_HOST)='; then
            echo "Unapproved Playwright browser download-host override detected" >&2
            exit 1
          fi
          test "$PLAYWRIGHT_BROWSERS_PATH" = "/ms-playwright"
          node -e "require('@playwright/test')[process.env.SHARD_BROWSER].launch()
            .then((browser)=>browser.close())
            .then(()=>console.log(process.env.SHARD_BROWSER+' digest-pinned runtime launched successfully'))
            .catch((error)=>{console.error(error);process.exit(1);});"
      - name: Playwright and axe assurance
        env:
          E2E_PROJECT: ${{ matrix.project }}
        run: pnpm test:e2e

  # Lighthouse keeps its own runner: parallel browser shards would add CPU
  # contention to a timing-sensitive gate.
  lighthouse:
    name: Lighthouse CI
    needs: quality-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node 24.20.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
      - name: Activate project package manager
        run: |
          corepack enable
          pnpm --version
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Lighthouse CI (desktop)
        run: pnpm lighthouse
      - name: Lighthouse CI (mobile routes)
        run: pnpm exec lhci autorun --config=./lighthouserc.mobile.json
      - name: Experience performance budget (SGPS-DEC-2026-025)
        run: node scripts/check-performance-budget.mjs .lighthouseci
      # Runs last: it rebuilds dist with the production origin.
      - name: Lighthouse CI (SEO, production origin)
        run: node scripts/run-lighthouse-seo.mjs

  # v10 E3 visual regression gate: chromium only, Linux baselines committed
  # in tests/visual/. Runs on every event like the engine shards (no
  # per-event gating). A failure blocks via this job's own required status;
  # the Browser Assurance aggregator is intentionally untouched. On failure the
  # diff images are uploaded for review. Snapshots are never auto-updated:
  # an intended visual change needs a PR that states why.
  visual-gate:
    name: Visual regression gate
    needs: quality-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node 24.20.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
      - name: Activate project package manager
        run: |
          corepack enable
          pnpm --version
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Build browser test artifact
        run: pnpm build
      - name: Install Playwright chromium runtime
        timeout-minutes: 10
        run: |
          set -e
          installed=0
          for attempt in 1 2 3; do
            if pnpm exec playwright install --with-deps chromium; then
              installed=1
              break
            fi
            echo "Attempt $attempt failed; waiting 20s before retry..."
            sleep 20
          done
          if [ "$installed" != "1" ]; then
            echo "Playwright runtime installation failed after 3 attempts" >&2
            exit 1
          fi
      - name: Visual regression gate (chromium)
        run: pnpm exec playwright test --project=visual
      - name: Upload diff images on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visual-gate-diffs
          path: |
            tests/visual/**/actual-*.png
            tests/visual/**/diff-*.png
            test-results/
          retention-days: 7

  # The single required check. It stays named "Browser Assurance" so the
  # branch ruleset keeps working, and it fails closed: every shard and
  # Lighthouse must be `success`; failed, cancelled and skipped all fail.
  browser-assurance:
    name: Browser Assurance
    needs: [browser-shards, lighthouse]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every browser shard and Lighthouse to succeed
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad="$(echo "$NEEDS_JSON" | jq '[.[] | select(.result != "success")] | length')"
          if [ "$bad" != "0" ]; then
            echo "Browser Assurance failed: $bad required job(s) did not succeed" >&2
            exit 1
          fi
