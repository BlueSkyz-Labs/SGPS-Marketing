# TEMPORARY baseline generator for the C3-E concierge PR (#501).
# Purpose: capture the Linux visual baselines for the /verify/ pages after the
# concierge surface landed. CI must never update snapshots after merge; this
# file is deleted in the same PR it serves (repo convention, E3 precedent).
#
# workflow_dispatch only fires from the default branch, so this file triggers
# itself via `on: push` narrowed to its own path.
name: visual-baseline-update

on:
  push:
    paths:
      - ".github/workflows/visual-baseline-update.yml"
  workflow_dispatch:
    inputs:
      update_snapshots:
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

jobs:
  capture:
    name: Capture Linux baselines
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v5
        with:
          node-version-file: ".node-version"
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Update visual snapshots (Linux)
        if: github.event_name == 'push' || inputs.update_snapshots
        run: pnpm exec playwright test --project=visual --update-snapshots
      - name: Upload baselines
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-baselines
          path: tests/visual/visual-regression.spec.ts-snapshots/
          retention-days: 3
