# TEMPORARY — v10 E3 baseline generator. REMOVED BEFORE MERGE.
#
# Generates the Linux (ubuntu-24.04, Playwright 1.63 / Chromium 1243) visual
# baselines for tests/visual/ and uploads them as an artifact. The agent then
# downloads the artifact, commits the PNGs, and deletes this file in the same
# PR. CI must never update snapshots.
#
# Token boundary: contents read-only; actions write-only for the artifact
# upload. No push, no commit, no deploy.
name: Visual baseline update (temporary)

on:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Regenerate baselines (true) or verify committed ones (false)"
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

jobs:
  baseline:
    name: Visual baseline update
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout branch candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node 24.20.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
      - name: Activate project package manager
        run: |
          corepack enable
          pnpm --version
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Build browser test artifact
        run: pnpm build
      - name: Install Playwright chromium runtime
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps chromium
      - name: Update visual baselines
        if: ${{ inputs.update_snapshots }}
        run: pnpm exec playwright test --project=visual --update-snapshots
      - name: Verify committed baselines
        if: ${{ !inputs.update_snapshots }}
        run: pnpm exec playwright test --project=visual
      - name: Upload baselines
        if: ${{ inputs.update_snapshots }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visual-baselines
          path: tests/visual/**/*-snapshots/
          retention-days: 7
