name: Canonical Docs Formatter Probe

on:
  push:
    branches:
      - audit/pin-wrangler-deploy-2026-09-07

permissions:
  contents: read

jobs:
  format-doc:
    name: Capture canonical remaining-convergence formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact hardening candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 285d339a130a0a0c1fbba67fe48872b680bacb7c
          persist-credentials: false
      - name: Set up Node 24.20.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.20.0
      - name: Activate integrity-pinned package manager
        run: |
          corepack enable
          pnpm --version
      - name: Install locked formatter without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Apply canonical formatting
        run: pnpm exec prettier --write docs/superpowers/plans/2026-09-03-remaining-convergence.md
      - name: Verify canonical formatting
        run: pnpm exec prettier --check docs/superpowers/plans/2026-09-03-remaining-convergence.md
      - name: Upload canonical document
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canonical-remaining-convergence-${{ github.sha }}
          path: docs/superpowers/plans/2026-09-03-remaining-convergence.md
          if-no-files-found: error
          retention-days: 1
