# verifier trigger: patched graph committed via lifecycle-free writer
name: Tooling Security Assurance

on:
  push:
    branches:
      - audit/pin-wrangler-deploy-2026-09-07

permissions:
  contents: read

concurrency:
  group: tooling-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify patched Lighthouse tooling graph
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node 24.20.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.20.0
      - name: Activate integrity-pinned package manager
        run: |
          corepack enable
          pnpm --version
      - name: Clean frozen install
        run: pnpm install --frozen-lockfile
      - name: Audit locked graph for high severity
        run: pnpm audit --audit-level=high
      - name: Tooling traversal contract
        run: node --test tests/architecture/tooling-vulnerabilities.test.mjs
      - name: Architecture contracts
        run: pnpm test:architecture
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Formatting
        run: pnpm format:check
      - name: Static build
        run: pnpm build
      - name: Client JavaScript budget
        run: pnpm check:client-budget
      - name: Static links
        run: pnpm check:static-links
      - name: Install Chromium runtime
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright and axe assurance
        run: pnpm exec playwright test --project=chromium
      - name: Lighthouse CI compatibility/regression
        run: pnpm lighthouse
