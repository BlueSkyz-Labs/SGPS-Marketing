name: Fully Patched Tooling Assurance

on:
  push:
    branches:
      - audit/pin-wrangler-deploy-2026-09-07

permissions:
  contents: read

concurrency:
  group: fully-patched-tooling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify fully patched LHCI graph
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node 24.20.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.20.0
      - name: Activate integrity-pinned package manager
        run: |
          corepack enable
          pnpm --version
      - name: Clean frozen install
        run: pnpm install --frozen-lockfile
      - name: Audit moderate-and-higher advisories
        run: pnpm audit --audit-level=moderate
      - name: Tooling advisory contract
        run: node --test tests/architecture/tooling-vulnerabilities.test.mjs
      - name: Architecture contracts
        run: pnpm test:architecture
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Formatting
        run: pnpm format:check
      - name: Static build
        run: pnpm build
      - name: Client JavaScript budget
        run: pnpm check:client-budget
      - name: Static links
        run: pnpm check:static-links
      - name: Install Chromium runtime
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright and axe assurance
        run: pnpm exec playwright test --project=chromium
      - name: Lighthouse CI compatibility/regression
        run: pnpm lighthouse
      - name: Explain non-perfect SEO audits
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const dir = '.lighthouseci';
          const files = fs.readdirSync(dir).filter((name) => /^lhr-.*\.json$/.test(name)).sort();
          if (!files.length) throw new Error('No Lighthouse LHR JSON reports found');
          const lhr = JSON.parse(fs.readFileSync(`${dir}/${files[0]}`, 'utf8'));
          const refs = lhr.categories?.seo?.auditRefs ?? [];
          const findings = refs
            .map(({ id, weight }) => ({ id, weight, ...(lhr.audits?.[id] ?? {}) }))
            .filter((audit) => audit.score !== null && audit.score < 1)
            .map(({ id, title, score, scoreDisplayMode, displayValue, explanation, weight }) => ({
              id, title, score, scoreDisplayMode, displayValue, explanation, weight,
            }));
          console.log(JSON.stringify({ seoScore: lhr.categories?.seo?.score, findings }, null, 2));
          NODE
