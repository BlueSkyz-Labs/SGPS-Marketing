name: Residual Security and SEO Diagnostics

on:
  push:
    branches:
      - audit/pin-wrangler-deploy-2026-09-07

permissions:
  contents: read

concurrency:
  group: residual-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-details:
    name: Enumerate residual dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node 24.20.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.20.0
      - name: Activate integrity-pinned package manager
        run: |
          corepack enable
          pnpm --version
      - name: Clean frozen install
        run: pnpm install --frozen-lockfile
      - name: Enumerate moderate-and-higher advisories
        run: pnpm audit --audit-level=moderate

  seo-details:
    name: Explain Lighthouse SEO warning
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node 24.20.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.20.0
      - name: Activate integrity-pinned package manager
        run: |
          corepack enable
          pnpm --version
      - name: Clean frozen install
        run: pnpm install --frozen-lockfile
      - name: Install Chromium runtime
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Lighthouse CI
        run: pnpm lighthouse
      - name: Explain non-perfect SEO audits
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const dir = '.lighthouseci';
          const files = fs.readdirSync(dir).filter((name) => /^lhr-.*\.json$/.test(name)).sort();
          if (!files.length) throw new Error('No Lighthouse LHR JSON reports found');
          const lhr = JSON.parse(fs.readFileSync(`${dir}/${files[0]}`, 'utf8'));
          const refs = lhr.categories?.seo?.auditRefs ?? [];
          const findings = refs
            .map(({ id, weight }) => ({ id, weight, ...(lhr.audits?.[id] ?? {}) }))
            .filter((audit) => audit.score !== null && audit.score < 1)
            .map(({ id, title, score, scoreDisplayMode, displayValue, explanation, weight }) => ({
              id, title, score, scoreDisplayMode, displayValue, explanation, weight,
            }));
          console.log(JSON.stringify({ seoScore: lhr.categories?.seo?.score, findings }, null, 2));
          NODE
