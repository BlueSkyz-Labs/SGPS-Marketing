name = "blueskyz-web"
compatibility_date = "2026-09-04"
# The canonical production hostname is managed through custom domains.
# Keep the generated workers.dev route disabled so a future deploy cannot
# accidentally reopen a public bypass around the intended hostname and WAF.
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
