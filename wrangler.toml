name = "blueskyz-web"
compatibility_date = "2026-09-04"
# The canonical production hostname is managed through custom domains.
# Keep the generated workers.dev route disabled so a future deploy cannot
# accidentally reopen a public bypass around the intended hostname and WAF.
workers_dev = false
preview_urls = false

[observability]
enabled = true
head_sampling_rate = 1

  [observability.logs]
  enabled = true
  head_sampling_rate = 1
  invocation_logs = true
  persist = true
  redact_query_string = true

[assets]
directory = "./dist"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
