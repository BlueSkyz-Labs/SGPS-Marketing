    heading: 我們如何使用資料
    content: 請求後設資料僅用於網站交付與安全。本站未啟用訪客行為分析；訪客明確選擇的語言或主題偏好僅儲存在本地瀏覽器。
  contact:
    heading: 聯絡我們
    content: 如有隱私諮詢，請透過安全報告通道與我們聯絡。
