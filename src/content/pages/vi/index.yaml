lang: vi
slug: index
title: BlueSkyz Labs
description: Chúng tôi làm những sản phẩm thông minh, giúp mọi người làm việc nhẹ nhàng và hiệu quả hơn.
sections:
  hero:
    heading: Trí tuệ. Nâng tầm. Tác động.
    subheading: Chúng tôi làm những sản phẩm thông minh, giúp mọi người làm việc nhẹ nhàng và hiệu quả hơn.
    supporting: Nhìn cao hơn để xây một ngày mai sáng hơn.
  onewhouse:
    heading: Một mái nhà
    intro: Làm rõ ràng, lớn lên vững vàng. Chúng tôi không làm theo một mảng sản phẩm cố định, mà làm theo một cách nghĩ.
    principles:
      - name: Trí tuệ
        summary: Nghĩ sâu. Giải pháp thông minh.
      - name: Nâng tầm
        summary: Nhìn cao hơn. Tác động lớn hơn.
      - name: Tin cậy
        summary: Nói rõ. Có bằng chứng để kiểm chứng.
      - name: Tác động
        summary: Giá trị thật. Thay đổi thật.
  trust:
    heading: Tin cậy
    intro: Sản phẩm nào đang ở giai đoạn nào, chúng tôi nói rõ. Quyền riêng tư, bảo mật và hỗ trợ đều có trang riêng — không phải khẩu hiệu.
    links:
      - label: Quyền riêng tư
        href: /vi/privacy/
      - label: Bảo mật
        href: /vi/security/
      - label: Hỗ trợ
        href: /vi/support/
  about:
    heading: Về BlueSkyz
    content: Chúng tôi làm những sản phẩm thông minh, giúp mọi người làm việc nhẹ nhàng và hiệu quả hơn. Nhìn cao hơn để xây một ngày mai sáng hơn.
    founder_name: Tony Nguyen
    founder_title: Nhà sáng lập kiêm CEO
  nextstep:
    heading: Bước tiếp theo
    intro: Hiện chưa có sản phẩm nào được phát hành công khai. Bạn có thể tìm hiểu về chúng tôi, hoặc dùng đường dẫn báo cáo bảo mật nếu cần một kênh đang hoạt động.
    primaryCta: Về BlueSkyz
    primaryHref: /vi/about/
    secondaryCta: Bảo mật
