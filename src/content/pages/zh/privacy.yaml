title: 隐私
description: BlueSkyz Labs 企业网站数据处理隐私政策。
sections:
  hero:
    heading: 隐私
  intro: 本页面说明 BlueSkyz Labs 企业网站的数据处理实践。
  collection:
    heading: 我们收集的内容
    content: 我们仅收集运营本网站及改善访客体验所需的最少数据。我们不会向第三方出售个人数据。
  usage:
    heading: 我们如何使用数据
    content: 请求元数据仅用于网站交付与安全。本站未启用访客分析数据传输；访客明确选择的语言或主题偏好仅保存在本地浏览器。
  contact:
    heading: 联系我们
    content: 如有隐私咨询，请通过安全报告通道与我们联系。
