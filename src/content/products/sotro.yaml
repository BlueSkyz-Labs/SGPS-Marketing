# Localized copy: faithful translations of the English claims above; the
# English record stays canonical for claim/proof binding. Native VI/ZH review
# is an Owner feedback checkpoint (plan v5 W3.4).
i18n:
  vi:
    shortDescription: "Sổ tay điện tử cho chủ nhà trọ ở Việt Nam: phòng, tiền phòng còn thiếu, lịch sử ghi chép đáng tin cậy và việc cần làm hôm nay."
    jobs:
      - "Xem tháng này còn ai chưa đóng tiền và hôm nay cần lo việc gì"
      - "Ghi lại phòng, người thuê, số điện nước và các khoản thu hằng tháng cho gọn, cho chắc"
    capabilities:
      - "Tính tiền điện nước từ số đọc công tơ, có giải thích rõ từng bậc giá điện"
      - "Biên nhận, và một bước xác nhận riêng trước khi ghi nhận tiền đã nhận"
      - "Mẫu tin nhắn nhắc lịch sự kiểu Zalo/SMS để sao chép; không tự động gửi"
    primaryActionLabel: "Xem trước Sổ Trọ"
  zh:
    shortDescription: "面向越南房东的数字笔记本：房间、应收租金、可信的历史记录与今日待办。"
    jobs:
      - "查看本月尚未收取的款项以及今天需要处理的事项"
      - "维护可靠的房间、租客、表计读数与每月费用记录"
    capabilities:
      - "根据表计读数计算水电费用，并清楚说明阶梯电价的各档明细"
      - "收据，以及在记录已收款项之前单独的一步确认"
      - "可选的、礼貌的 Zalo/短信风格提醒消息，供复制使用；不会自动发送"
    primaryActionLabel: "预览 Sổ Trọ"
