slug: sotro
name: Sổ Trọ
shortDescription: A Vietnam-first digital landlord notebook for rooms, rent dues, trusted history, and today's work.
lifecycle: development
availability: preview
publicLabel: In development
audience:
  - professional
  - business
jobs:
  - See what remains unpaid this month and what needs attention today
  - Maintain dependable room, tenant, meter, and monthly charge records
capabilities:
  - Utility charges from meter readings, with a readable tiered-electricity breakdown
  - Receipts, and a separate confirmation step before received money is recorded
  - Optional polite Zalo/SMS-style reminder messages to copy; nothing is sent automatically
platforms:
  - web
primaryAction:
  type: preview
  label: Preview Sổ Trọ
  href: https://blueskyzlabs.com/en/products/sotro/
