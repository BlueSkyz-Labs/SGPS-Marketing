slug: sotro
name: Sổ Trọ
shortDescription: "For landlords in Vietnam: see what is still unpaid this month and what needs doing today."
lifecycle: beta
availability: preview
publicLabel: Preview
audience:
  - individual
jobs:
  - See at a glance who still owes rent this month and what needs doing today
  - Collect rent and record each payment once, correctly, without a spreadsheet
  - Keep rooms, tenants, meter readings and the residence register in one place
capabilities:
  - Collect rent with a review-then-confirm step, a bank-transfer QR code and a receipt to copy into Zalo
  - Large text and big buttons built for older landlords; a family helper's phone joins by scanning a QR code
  - A month-readiness view of who still owes and what is due, plus a C06 residence spreadsheet to download
platforms:
  - web
# schema.org SoftwareApplication category (Owner delegated best practice, 2026-10-04):
