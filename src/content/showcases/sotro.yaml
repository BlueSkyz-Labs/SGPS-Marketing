# Feature story (v12 S1): a landlord's month told with the screens above, in
# the order the month runs. Each chapter names one phone screen; `fact` binds
# the registered job or capability (src/content/products/sotro.yaml, 1-based)
# this chapter's task relates to. It is not a claim about what the screen
# shows. Rooms and Night mode bind none: no registered entry is their task.
# The coda is the owner's desktop view of the same month.
story:
  chapters:
    - screen: today
      fact: job-1
    - screen: utilities
      fact: capability-1
    - screen: collect
      fact: capability-2
    - screen: rooms
    - screen: candlelight
  coda: owner-collect

guide:
  title:
    en: Getting started with Sổ Trọ
    vi: Bắt đầu với Sổ Trọ
    zh: Sổ Trọ 入门指南
    zh-hant: Sổ Trọ 入門指南
  intro:
    en: "Sổ Trọ has two sides: the owner sets things up on a computer, and family members do the daily work on a paired phone. These steps follow the screens of the current development build."
    vi: "Sổ Trọ có hai phía: chủ trọ thiết lập trên máy tính, người nhà làm việc hằng ngày trên điện thoại đã ghép. Các bước dưới đây theo đúng màn hình của bản đang phát triển."
    zh: Sổ Trọ 分两端：房东在电脑上设置，家人在已配对的手机上处理日常事务。以下步骤按照当前开发版本的界面编写。
    zh-hant: Sổ Trọ 分兩端：房東在電腦上設定，家人在已配對的手機上處理日常事務。以下步驟按照當前開發版本的介面編寫。
  steps:
    - id: create-building
      screen: setup
      role: owner
      title:
        en: Create your building
        vi: Tạo dãy trọ
        zh: 创建楼栋
        zh-hant: 建立樓棟
      body:
        en: "Sign in to the owner console and follow the four-step setup: name and address, the list of rooms, starting electricity and water prices, then finish."
        vi: "Đăng nhập khu quản trị và làm theo 4 bước: tên và địa chỉ dãy trọ, danh sách phòng, giá điện nước ban đầu, rồi hoàn tất."
        zh: 登录房东后台，按四步完成设置：名称与地址、房间列表、初始水电价格，然后完成。
        zh-hant: 登入房東後臺，按四步完成設定：名稱與地址、房間列表、初始水電價格，然後完成。
    - id: check-rooms
      screen: property
      role: owner
      title:
        en: Check rooms, meters and tariffs
        vi: Kiểm tra phòng, công tơ, biểu giá
        zh: 核对房间、电表与价目
        zh-hant: 核對房間、電錶與價目
      body:
        en: Under “Dãy trọ & phòng”, review the room map, meters and price table. The badges show occupied rooms, vacant rooms and what needs handling.
        vi: Trong “Dãy trọ & phòng”, xem sơ đồ phòng, công tơ và biểu giá. Các nhãn cho biết phòng đang thuê, phòng trống và việc cần xử lý.
        zh: 在“Dãy trọ & phòng”中查看房间图、电表和价目表。标签显示在租、空房及待处理事项。
        zh-hant: 在「Dãy trọ & phòng」中檢視房間圖、電錶和價目表。標籤顯示在租、空房及待處理事項。
    - id: add-family
      screen: family
      role: owner
      title:
        en: Prepare a phone for each family member
        vi: Chuẩn bị điện thoại cho người nhà
        zh: 为每位家人准备手机
        zh-hant: 為每位家人準備手機
      body:
        en: Under “Gia đình & thiết bị”, set up each family member who will use Sổ Trọ day to day and create a pairing code or link for their phone.
        vi: Trong “Gia đình & thiết bị”, thiết lập từng người nhà sẽ dùng Sổ Trọ hằng ngày và tạo mã hoặc liên kết ghép nối cho điện thoại của họ.
        zh: 在“Gia đình & thiết bị”中设置每位日常使用 Sổ Trọ 的家人，并为其手机创建配对码或链接。
        zh-hant: 在「Gia đình & thiết bị」中設定每位日常使用 Sổ Trọ 的家人，併為其手機建立配對碼或連結。
    - id: pair-phone
      screen: pair
      role: family
      title:
        en: Connect the phone
        vi: Kết nối điện thoại
        zh: 连接手机
        zh-hant: 連線手機
      body:
        en: The family member opens the link on their own phone and taps “Kết nối điện thoại này”. If the code has expired, the owner simply creates a new one.
        vi: Người nhà mở liên kết trên điện thoại của mình và bấm “Kết nối điện thoại này”. Nếu mã đã hết hạn, chủ trọ chỉ cần tạo mã mới.
        zh: 家人在自己的手机上打开链接并点击“Kết nối điện thoại này”。如配对码过期，房东重新创建即可。
        zh-hant: 家人在自己的手機上開啟連結並點選「Kết nối điện thoại này」。如配對碼過期，房東重新建立即可。
    - id: daily
      screen: today
      role: family
      title:
        en: Start each day on the home screen
        vi: Mỗi ngày bắt đầu từ màn hình chính
        zh: 每天从首页开始
        zh-hant: 每天從首頁開始
      body:
        en: The home screen lists only what needs doing today. Finished items disappear on their own.
        vi: Màn hình chính chỉ liệt kê việc cần làm hôm nay. Làm xong, việc sẽ tự biến mất.
        zh: 首页只列出今天要做的事，完成后会自动消失。
        zh-hant: 首頁只列出今天要做的事，完成後會自動消失。
    - id: meters
      screen: utilities
      role: family
      title:
        en: Record meter readings at month end
        vi: Ghi điện nước cuối tháng
        zh: 月底记录水电
        zh-hant: 月底記錄水電
      body:
        en: Open “Điện nước”, choose an occupied room and enter the readings. After saving, Sổ Trọ can take you straight to the next room. The screen also offers to prepare for working offline.
        vi: Mở “Điện nước”, chọn phòng đang thuê và nhập chỉ số. Lưu xong, Sổ Trọ có thể chuyển thẳng sang phòng kế tiếp. Màn hình cũng cho phép chuẩn bị để làm việc khi không có mạng.
        zh: 打开“Điện nước”，选择在租房间并录入读数。保存后可直接进入下一间。该页面还可预先准备离线工作。
        zh-hant: 開啟「Điện nước」，選擇在租房間並輸入讀數。儲存後可直接進入下一間。該頁面還可預先準備離線工作。
    - id: collect-rent
      screen: collect
      role: family
      title:
        en: Collect rent
        vi: Thu tiền phòng
        zh: 收取房租
        zh-hant: 收取房租
      body:
        en: Open “Thu tiền” to see who still owes. Confirm the amount first, then record what was received. Opening the screen does not close anything out by itself.
        vi: Mở “Thu tiền” để xem ai còn nợ. Chốt số tiền trước rồi mới ghi nhận đã thu; chỉ mở xem thì Sổ Trọ không tự chốt.
        zh: 打开“Thu tiền”查看谁还欠款。先确认金额再记录已收；仅打开查看不会自动结账。
        zh-hant: 開啟「Thu tiền」檢視誰還欠款。先確認金額再記錄已收；僅開啟檢視不會自動結賬。
    - id: review
      screen: owner-collect
      role: owner
      title:
        en: Follow along from the owner console
        vi: Theo dõi từ khu quản trị
        zh: 在后台同步查看
        zh-hant: 在後臺同步檢視
      body:
        en: The owner sees the same collection status on a computer, grouped by paid, due and overdue.
        vi: Chủ trọ thấy cùng tình trạng thu tiền trên máy tính, chia theo đã thu đủ, đến hạn và quá hạn.
        zh: 房东在电脑上看到同样的收款状态，按已收齐、到期与逾期分组。
        zh-hant: 房東在電腦上看到同樣的收款狀態，按已收齊、到期與逾期分組。
