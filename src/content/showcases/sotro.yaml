# revision below, with the repository's synthetic demo seed (db/seeds): no real
# tenant, payment or identity data. Phone screens: 390x844 CSS px at 2x,
# cropped above the bottom navigation bar; desktop screens: 1440x900 CSS px.
# Wording below describes only what each screen shows at that revision.
