      vi: "thẻ chào mừng lần đầu: biểu tượng Sổ Tâm, ghi chú không cần tài khoản và bản viết trên Web lưu trong trình duyệt này, không mã hóa, cùng nút bắt đầu. Bản đang phát triển."
      zh: "首次打开的欢迎卡片：Sổ Tâm 标志，注明无需账号、网页端文字保存在此浏览器中，未加密也不同步，另有开始按钮。开发版本。"
      zh-hant: "首次開啟的歡迎卡片：Sổ Tâm 標誌，註明無需帳號、網頁端文字儲存在此瀏覽器中，未加密也不同步，另有開始按鈕。開發版本。"
    alt:
