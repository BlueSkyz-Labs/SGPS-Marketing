# Sổ Tâm showcase — real screens of the running web application.
# Captured 2026-10-25 from a local build of BlueSkyz-Labs/sotam at the revision
# below (apps/web bundled with esbuild and served statically; no sign-in, no
# backend, no account: the web app's local-first draft surface only) with
# synthetic demo text typed by the capture script. Phone screens: 390x844 CSS px
# at 2x. The product is In development: every screen is a development build,
# not a launched app, and several screens are labelled "Xem trước" (preview) in
# the app itself. Wording below describes only what each screen shows; no
# export, recovery or sync feature is shown as working.
# zh / zh-hant text: machine-assisted (zh-hant via OpenCC s2twp), pending
# native review. Copy is an Owner-approval candidate.
product: sotam
