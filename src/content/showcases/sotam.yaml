      vi: "Sổ Tâm trên trình duyệt máy tính: khung viết có đoạn mẫu và thông báo “Draft saved on this device”."
      zh: "桌面浏览器中的 Sổ Tâm：书写框内有示例文字，并显示“Draft saved on this device”提示。"
      zh-hant: "桌面瀏覽器中的 Sổ Tâm：書寫框內有範例文字，並顯示「Draft saved on this device」提示。"

# Feature story: writing a reflection, told with the screens above. `fact`
# binds the registered job or capability (src/content/products/sotam.yaml,
# 1-based) this chapter's task relates to; it is not a claim about what the
# screen shows. The coda is the same writing box on a desktop browser.
story:
  chapters:
    - screen: today
      fact: job-1
    - screen: write
      fact: capability-1
    - screen: saved
      fact: capability-1
    - screen: journal
      fact: job-2
  coda: desktop-write
