# Sổ Tâm showcase — real screens of the running web application.
# Captured 2026-10-24 from a local build of BlueSkyz-Labs/sotam at the revision
# below (apps/web, no sign-in needed to reach these screens), with a sample
# reflection typed by hand: no real person, account or journal content. Phone
# screens: 390x844 CSS px at 2x; desktop coda: 1440x900 CSS px. The page shows
# today's date and season from the device clock. The web build is a preview:
# its Journal screen supports the active local draft only, so no dated entry
# list is shown. Local export is not reachable on web and is not pictured.
# Wording below describes only what each screen shows at that revision.
# zh / zh-hant text: machine-assisted (zh-hant via OpenCC s2twp), pending native
# review. Copy is an Owner-approval candidate.
product: sotam
capture:
  kind: ui-screenshot
  data: synthetic-demo
  environment: local-test-build
  sourceRepository: https://github.com/BlueSkyz-Labs/sotam
  sourceRevision: abde8fdc22cdf0440e1c9a6faf3fe73440378a3f
  capturedAt: 2026-10-24

screens:
  - id: today
    surface: phone
    src: /products/sotam/showcase/ph-01-today.webp
