<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRuby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="50%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="goldLedger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#facc15" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Background Ruby Red -->
  <rect width="512" height="512" rx="128" fill="url(#bgRuby)" />
  <!-- Outer Gold Safe-Zone Border -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#goldLedger)" stroke-width="8" opacity="0.6" />
  <!-- Red Ledger Book with Gold Trim -->
  <rect x="96" y="80" width="320" height="352" rx="28" fill="#991b1b" stroke="url(#goldLedger)" stroke-width="10" filter="url(#shadow)" />
  <!-- Book Spine / Bindings -->
  <rect x="80" y="80" width="36" height="352" rx="12" fill="url(#goldLedger)" />
  <!-- Golden House Key Icon on Top -->
  <circle cx="256" cy="160" r="32" fill="none" stroke="url(#goldLedger)" stroke-width="12" />
  <path d="M256 192 L256 240 M256 216 L272 216 M256 230 L272 230" stroke="url(#goldLedger)" stroke-width="10" stroke-linecap="round" />
  <!-- Vietnamese Text 'SỔ TRỌ' in Gold -->
  <text x="268" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="76" font-weight="900" text-anchor="middle" fill="url(#goldLedger)" letter-spacing="3" filter="url(#shadow)">SỔ TRỌ</text>
  <!-- Fortune Gold Coins -->
  <circle cx="140" cy="380" r="22" fill="url(#goldLedger)" />
  <circle cx="370" cy="380" r="22" fill="url(#goldLedger)" />
</svg>
